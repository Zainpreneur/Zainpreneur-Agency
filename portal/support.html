<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support &amp; Requests — Zainpreneur Client Portal</title>
<link rel="stylesheet" href="css/portal.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <a href="dashboard.html">
        <div class="mark">ZP</div>
        <div>
          <div class="name">Zainpreneur Agency</div>
          <div class="tag">Client Portal</div>
        </div>
      </a>
    </div>
    <nav class="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="avatar" id="userChipInitials">–</div>
        <div class="who">
          <div class="name" id="userChipName">Loading…</div>
          <div class="sub" id="userChipSub"></div>
        </div>
      </div>
      <button class="btn-logout" id="logoutBtn">Log out</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <h1>Support &amp; Requests</h1>
        <div class="topbar-sub" id="topbarDate"></div>
      </div>
    </header>

    <main class="content">
      <div class="panel">
        <div class="panel-header"><h2>Open a Request</h2></div>
        <div class="panel-body">
          <div id="formAlert"></div>
          <form id="ticketForm">
            <div class="form-grid">
              <div class="field">
                <label for="t_subject">Subject</label>
                <input type="text" id="t_subject" required placeholder="What do you need help with?">
              </div>
              <div class="field">
                <label for="t_service">Service</label>
                <select id="t_service"></select>
              </div>
            </div>
            <div class="form-grid">
              <div class="field">
                <label for="t_priority">Priority</label>
                <select id="t_priority">
                  <option value="normal">Normal</option>
                  <option value="high">High — business is impacted</option>
                  <option value="low">Low — no rush</option>
                </select>
              </div>
            </div>
            <div class="field">
              <label for="t_details">Details</label>
              <textarea id="t_details" required placeholder="Describe the issue or request…"></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top:8px;">Submit Request</button>
          </form>
        </div>
      </div>

      <div class="filter-bar">
        <div class="pill-tabs" id="statusTabs">
          <button data-status="all" class="active">All</button>
          <button data-status="open">Open</button>
          <button data-status="in-progress">In Progress</button>
          <button data-status="resolved">Resolved</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-body no-pad">
          <div class="table-wrap">
            <table class="zp-table" id="ticketTable">
              <thead><tr><th>Ticket</th><th>Subject</th><th>Service</th><th>Priority</th><th>Updated</th><th>Status</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="ticketModal">
  <div class="modal" style="max-width:680px;">
    <div class="modal-header">
      <h2 id="ticketModalTitle">Request</h2>
      <button class="modal-close" id="ticketModalClose">×</button>
    </div>
    <div class="modal-body" id="ticketModalBody"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/catalogue.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/api.js"></script>
<script src="js/search.js"></script>
<script src="js/notifications.js"></script>
<script src="js/support.js"></script>
</body>
</html>
