<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Services — Zainpreneur Client Portal</title>
<link rel="stylesheet" href="css/portal.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <a href="dashboard.html">
        <div class="mark">ZP</div>
        <div>
          <div class="name">Zainpreneur Agency</div>
          <div class="tag">Client Portal</div>
        </div>
      </a>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" data-nav="dashboard"><span class="icon">🏠</span>Dashboard</a>
      <a href="services.html" data-nav="services"><span class="icon">🧰</span>My Services</a>
      <a href="invoices.html" data-nav="invoices"><span class="icon">🧾</span>Invoices &amp; Billing</a>
      <a href="request-service.html" data-nav="request"><span class="icon">➕</span>Request a Service</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="avatar" id="userChipInitials">–</div>
        <div class="who">
          <div class="name" id="userChipName">Loading…</div>
          <div class="sub" id="userChipSub"></div>
        </div>
      </div>
      <button class="btn-logout" id="logoutBtn">Log out</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <h1>My Services</h1>
        <div class="topbar-sub" id="topbarDate"></div>
      </div>
      <div class="topbar-right">
        <a href="request-service.html" class="btn btn-primary btn-sm">+ Request a Service</a>
      </div>
    </header>

    <main class="content">
      <div class="filter-bar">
        <div class="pill-tabs" id="categoryTabs">
          <button data-cat="all" class="active">All</button>
          <button data-cat="infrastructure">Infrastructure</button>
          <button data-cat="custom-development">Custom Dev</button>
          <button data-cat="maintenance">Maintenance</button>
        </div>
        <select id="statusFilter">
          <option value="all">All statuses</option>
          <option value="active">Active</option>
          <option value="provisioning">Provisioning</option>
          <option value="in-development">In Development</option>
          <option value="completed">Completed</option>
          <option value="paused">Paused</option>
        </select>
      </div>

      <div class="service-grid" id="serviceGrid"></div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Service</h2>
      <button class="modal-close" id="modalClose">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/services.js"></script>
</body>
</html>
